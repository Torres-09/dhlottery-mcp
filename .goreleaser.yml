version: 2

builds:
  - id: dhlottery-mcp
    main: ./cmd/dhlottery-mcp
    binary: dhlottery-mcp
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

dockers:
  - image_templates:
      - "ghcr.io/torres-09/dhlottery-mcp:{{ .Tag }}"
      - "ghcr.io/torres-09/dhlottery-mcp:latest"
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"

brews:
  - name: dhlottery-mcp
    repository:
      owner: Torres-09
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/Torres-09/dhlottery-mcp"
    description: "동행복권 로또 6/45 MCP 서버"
    license: "MIT"
    install: |
      bin.install "dhlottery-mcp"
    test: |
      system "#{bin}/dhlottery-mcp", "--version"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
